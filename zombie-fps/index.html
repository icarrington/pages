<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Zombie Arena</title>
<style>
  :root{
    --bg:#05070a; --panel:#0a0f0c; --line:#16241d;
    --green:#57ff9e; --green-dim:#2f7d54; --red:#ff3b3b; --amber:#ffb454;
    --ink:#cfe6d6; --mono:ui-monospace,"Cascadia Mono","JetBrains Mono","SFMono-Regular",Menlo,Consolas,monospace;
    --disp:"Bahnschrift","DIN Alternate","Oswald","Franklin Gothic Medium","Arial Narrow",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);overflow:hidden}
  body{font-family:var(--mono);color:var(--ink);-webkit-font-smoothing:antialiased;
       touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
  #wrap{position:fixed;inset:0;overflow:hidden;cursor:crosshair}
  #c{position:absolute;inset:0;width:100%;height:100%;display:block}
  .hidden{display:none!important}

  /* ---------- HUD ---------- */
  #hud{position:absolute;inset:0;pointer-events:none;z-index:5}
  .hud-corner{position:absolute;font-size:13px;letter-spacing:.14em}
  #hud-tl{top:16px;left:18px}
  #hud-tr{top:16px;right:18px;text-align:right}
  .hud-label{display:block;font-size:10px;letter-spacing:.34em;color:var(--green-dim);margin-bottom:4px}
  .hud-big{font-family:var(--disp);font-size:34px;font-weight:700;line-height:.9;color:var(--green);
           text-shadow:0 0 14px rgba(87,255,158,.45)}
  #hud-tl .hud-big{font-size:28px}
  .hud-score{font-family:var(--disp);font-size:20px;font-weight:700;color:var(--ink);
             text-shadow:0 0 10px rgba(87,255,158,.25);letter-spacing:.02em}
  .hud-sub{font-size:11px;letter-spacing:.2em;color:var(--green-dim);margin-top:3px}
  .hpbar{width:190px;height:12px;margin-top:8px;border:1px solid var(--green-dim);
         background:rgba(0,0,0,.4);position:relative;overflow:hidden}
  #hp-fill{position:absolute;inset:0;width:100%;background:linear-gradient(90deg,#2f7d54,var(--green));
           box-shadow:0 0 12px rgba(87,255,158,.6);transition:width .12s linear}
  #hp-fill.low{background:linear-gradient(90deg,#7a1414,var(--red));box-shadow:0 0 12px rgba(255,59,59,.7)}
  #hp-num{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:9px;letter-spacing:.1em;color:#04120b;font-weight:700}
  .hpbar.low #hp-num{color:#1a0404}
  #hud-bc{left:50%;bottom:14px;transform:translateX(-50%);text-align:center}
  .ammo{font-family:var(--disp);font-size:30px;font-weight:700;letter-spacing:.04em;color:var(--green);
        text-shadow:0 0 12px rgba(87,255,158,.4)}
  .ammo .res{font-size:16px;color:var(--green-dim)}
  .ammo.low{color:var(--red);text-shadow:0 0 12px rgba(255,59,59,.6)}
  .ammo.low .res{color:#7a2a2a}
  .ammo-reload{font-size:10px;letter-spacing:.3em;color:var(--amber);margin-top:2px}

  /* ---------- Screens ---------- */
  .screen{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
          background:radial-gradient(120% 120% at 50% 40%,rgba(6,10,8,.55),rgba(3,5,4,.82));
          backdrop-filter:blur(2px);animation:fade .5s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .screen::before{content:"";position:absolute;inset:0;pointer-events:none;
      background:repeating-linear-gradient(0deg,rgba(87,255,158,.05) 0 1px,transparent 1px 3px);
      mix-blend-mode:screen;animation:scan 8s linear infinite}
  @keyframes scan{from{background-position:0 0}to{background-position:0 120px}}
  .panel{position:relative;width:min(92vw,640px);padding:34px 40px 30px;text-align:center;
         border:1px solid var(--line);background:linear-gradient(180deg,rgba(10,15,12,.9),rgba(6,9,7,.9));
         box-shadow:0 0 60px rgba(0,0,0,.7),inset 0 0 40px rgba(87,255,158,.04)}
  .panel::before,.panel::after{content:"";position:absolute;width:22px;height:22px;border:2px solid var(--green-dim)}
  .panel::before{top:-2px;left:-2px;border-right:0;border-bottom:0}
  .panel::after{bottom:-2px;right:-2px;border-left:0;border-top:0}
  .tag{font-size:10px;letter-spacing:.42em;color:var(--green-dim);margin-bottom:14px}
  .title{font-family:var(--disp);font-weight:700;line-height:.82;letter-spacing:.02em;
         font-size:clamp(46px,11vw,92px);color:#eafff2;text-shadow:0 0 30px rgba(87,255,158,.35)}
  .title .r{color:var(--red);text-shadow:0 0 34px rgba(255,59,59,.6)}
  .title .blip{display:inline-block;width:.16em;height:.16em;background:var(--red);margin-left:.14em;
               box-shadow:0 0 14px var(--red);animation:blink 1.1s steps(2) infinite}
  @keyframes blink{50%{opacity:.15}}
  .sub{font-size:12px;letter-spacing:.24em;color:var(--green-dim);margin:14px 0 22px}
  .controls{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:10px 22px;margin:0 auto 26px;max-width:440px;text-align:left}
  .controls li{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.1em;color:var(--ink)}
  .key{min-width:52px;text-align:center;padding:4px 8px;border:1px solid var(--green-dim);color:var(--green);
       font-size:11px;letter-spacing:.14em;background:rgba(87,255,158,.05)}
  .btn{pointer-events:auto;cursor:pointer;font-family:var(--disp);font-weight:700;font-size:20px;letter-spacing:.18em;
       color:#04120b;background:linear-gradient(180deg,#7dffb4,var(--green));border:0;padding:14px 34px;
       box-shadow:0 0 26px rgba(87,255,158,.5);transition:transform .12s ease,box-shadow .12s ease}
  .btn:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 0 40px rgba(87,255,158,.8)}
  .btn:active{transform:translateY(0) scale(.99)}
  .btn.red{background:linear-gradient(180deg,#ff7a7a,var(--red));color:#1a0404;box-shadow:0 0 26px rgba(255,59,59,.5)}
  .btn.red:hover{box-shadow:0 0 40px rgba(255,59,59,.8)}
  .foot{font-size:10px;letter-spacing:.28em;color:var(--green-dim);margin-top:20px}

  .go-title{font-family:var(--disp);font-weight:700;font-size:clamp(40px,9vw,76px);color:var(--red);
            text-shadow:0 0 34px rgba(255,59,59,.5);letter-spacing:.04em}
  .go-stats{display:flex;gap:14px;justify-content:center;margin:24px 0 28px;flex-wrap:wrap}
  .stat{min-width:120px;padding:14px 18px;border:1px solid var(--line);background:rgba(0,0,0,.35)}
  .stat .k{font-size:10px;letter-spacing:.28em;color:var(--green-dim)}
  .stat .v{font-family:var(--disp);font-size:34px;font-weight:700;color:var(--ink);margin-top:4px}
  .stat .v.g{color:var(--green)}

  /* ---------- Wave banner ---------- */
  #banner{position:absolute;left:0;right:0;top:26%;z-index:6;text-align:center;pointer-events:none;
          font-family:var(--disp);font-weight:700;letter-spacing:.14em}
  #banner .b1{font-size:clamp(30px,7vw,64px);color:var(--green);text-shadow:0 0 30px rgba(87,255,158,.55)}
  #banner .b2{font-size:clamp(14px,3vw,22px);color:var(--red);letter-spacing:.3em;margin-top:6px;text-shadow:0 0 18px rgba(255,59,59,.5)}
  #banner.show{animation:banner 2.4s ease forwards}
  @keyframes banner{0%{opacity:0;transform:translateY(14px)}12%{opacity:1;transform:translateY(0)}
                    78%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}

  /* ---------- Touch ---------- */
  #touch{position:absolute;inset:0;z-index:8;pointer-events:none}
  .tbtn{position:absolute;pointer-events:auto;width:74px;height:74px;border-radius:50%;
        border:1px solid var(--green-dim);background:rgba(87,255,158,.08);color:var(--green);
        font-family:var(--disp);font-size:26px;font-weight:700;display:flex;align-items:center;justify-content:center;
        box-shadow:inset 0 0 20px rgba(0,0,0,.5)}
  .tbtn:active{background:rgba(87,255,158,.22)}
  #t-fire{right:18px;bottom:26px;width:96px;height:96px;font-size:18px;letter-spacing:.04em;
          border-color:var(--red);color:var(--red);background:rgba(255,59,59,.1)}
  #t-reload{right:132px;bottom:34px;width:60px;height:60px;font-size:22px}
  #joy{position:absolute;left:18px;bottom:22px;width:132px;height:132px;border-radius:50%;
       border:1px solid var(--green-dim);background:rgba(87,255,158,.05);pointer-events:auto}
  #joy-knob{position:absolute;left:50%;top:50%;width:56px;height:56px;border-radius:50%;
       transform:translate(-50%,-50%);background:rgba(87,255,158,.25);border:1px solid var(--green)}

  @media (max-width:560px){
    .controls{grid-template-columns:1fr;gap:8px}
    .panel{padding:26px 22px}
    .hpbar{width:150px}
    #hud-tl .hud-big,#hud-tr .hud-big{font-size:24px}
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>

  <div id="hud" class="hidden">
    <div class="hud-corner" id="hud-tl">
      <span class="hud-label">INTEGRITY</span>
      <div class="hpbar" id="hpbar"><div id="hp-fill"></div><span id="hp-num">100</span></div>
    </div>
    <div class="hud-corner" id="hud-tr">
      <span class="hud-label">WAVE</span>
      <div class="hud-big" id="wave-num">1</div>
      <span class="hud-label" style="margin-top:10px">SCORE</span>
      <div class="hud-score" id="score-num">0</div>
      <span class="hud-sub" id="kill-num">KILLS 0</span>
    </div>
    <div class="hud-corner" id="hud-bc">
      <div class="ammo" id="ammo"><span id="ammo-mag">30</span> <span class="res">/ ∞</span></div>
      <div class="ammo-reload" id="ammo-reload"></div>
    </div>
  </div>

  <div id="banner"><div class="b1" id="banner-1"></div><div class="b2" id="banner-2"></div></div>

  <div id="touch" class="hidden">
    <div id="joy"><div id="joy-knob"></div></div>
    <div class="tbtn" id="t-reload">R</div>
    <div class="tbtn" id="t-fire">FIRE</div>
  </div>

  <div id="start" class="screen">
    <div class="panel">
      <div class="tag">// TACTICAL DEFENSE PROTOCOL 07</div>
      <h1 class="title">ZOMBIE <span class="r">ARENA</span><span class="blip"></span></h1>
      <div class="sub">HOLD THE COURTYARD · SURVIVE THE WAVES</div>
      <ul class="controls">
        <li><span class="key">W A S D</span> Move</li>
        <li><span class="key">MOUSE</span> Aim</li>
        <li><span class="key">CLICK</span> Fire</li>
        <li><span class="key">R</span> Reload</li>
      </ul>
      <button class="btn" id="start-btn">▶ CLICK TO START</button>
      <div class="foot">AUDIO ON · POINTER LOCK ENGAGES ON START</div>
    </div>
  </div>

  <div id="over" class="screen hidden">
    <div class="panel">
      <div class="tag">// SIGNAL LOST</div>
      <h1 class="go-title">YOU DIED</h1>
      <div class="go-stats">
        <div class="stat"><div class="k">FINAL SCORE</div><div class="v g" id="go-score">0</div></div>
        <div class="stat"><div class="k">WAVE REACHED</div><div class="v" id="go-wave">1</div></div>
        <div class="stat"><div class="k">KILLS</div><div class="v" id="go-kills">0</div></div>
      </div>
      <button class="btn red" id="again-btn">↻ PLAY AGAIN</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* ===================== SETUP ===================== */
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
let W=0,H=0;
function resize(){W=canvas.width=canvas.clientWidth;H=canvas.height=canvas.clientHeight;}
window.addEventListener('resize',resize); resize();

/* ===================== MAP ===================== */
const MAP=[
"##########",
"#........#",
"#.##...##.",
"#........#",
"#..#...#..",
"#..#...#..",
"#........#",
"#.##...##.",
"#........#",
"##########"
];
const MW=MAP[0].length, MH=MAP.length;
const isWall=(x,y)=>{ if(x<0||y<0||x>=MW||y>=MH) return true; return MAP[y|0][x|0]==='#'; };
const PLAYER_START={x:5.0,y:8.0,a:Math.PI/2};

/* ===================== STATE ===================== */
const S={
  state:'start', hp:100, maxhp:100,
  mag:30, magsize:30, reloading:false, reloadT:0, reloadTime:1.1,
  wave:0, kills:0, score:0,
  zombies:[], particles:[],
  player:{x:PLAYER_START.x,y:PLAYER_START.y,a:PLAYER_START.a},
  shootCd:0, muzzle:0, recoil:0,
  hitCd:0, hitFlash:0, shake:0,
  bannerT:0, waveDelay:0,
  keys:{}, lastT:0
};
const zbuf=new Float32Array(1);
const zlist=[];
const zimg=document.createElement('canvas'); zimg.width=100;zimg.height=150;
const zhit=document.createElement('canvas'); zhit.width=100;zhit.height=150;
const zdead=document.createElement('canvas'); zdead.width=100;zdead.height=150;

/* ===================== AUDIO ===================== */
let AC=null;
function ac(){ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended')AC.resume(); return AC; }
function noiseBuf(dur){ const a=ac(),n=(a.sampleRate*dur)|0,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=Math.random()*2-1; return b; }
function blip(freq,dur,type,vol,slideTo){ const a=ac(),o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type=type; o.frequency.setValueAtTime(freq,t); if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur); }
const sfx={
  shoot(){ const a=ac(),n=noiseBuf(0.18),s=a.createBufferSource();s.buffer=n;
    const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=1400;
    const g=a.createGain(),t=a.currentTime; g.gain.setValueAtTime(0.5,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.18);
    s.connect(f).connect(g).connect(a.destination); s.start(t);
    blip(120,0.12,'square',0.25,60); },
  hit(){ blip(520,0.06,'square',0.22,300); },
  death(){ const a=ac(),n=noiseBuf(0.35),s=a.createBufferSource();s.buffer=n;
    const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=300;
    const g=a.createGain(),t=a.currentTime; g.gain.setValueAtTime(0.35,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.35);
    s.connect(f).connect(g).connect(a.destination); s.start(t);
    blip(180,0.3,'sawtooth',0.18,50); },
  reload(){ blip(300,0.05,'square',0.18,240); setTimeout(()=>blip(360,0.05,'square',0.18,420),120); }
};

/* ===================== SPRITES ===================== */
function drawZombie(c,dead){
  const g=c.getContext('2d'); g.clearRect(0,0,100,150);
  const body=dead?'#2a0a0a':'#5a1414', dark=dead?'#1a0606':'#3a0d0d';
  g.fillStyle=dark; // legs
  g.fillRect(34,100,12,44); g.fillRect(54,100,12,44);
  // torso
  g.fillStyle=body; g.beginPath();
  g.moveTo(30,54); g.lineTo(70,54); g.lineTo(74,104); g.lineTo(26,104); g.closePath(); g.fill();
  // arms (outstretched)
  g.fillStyle=dark;
  g.save(); g.translate(30,60); g.rotate(0.5); g.fillRect(-24,0,26,11); g.restore();
  g.save(); g.translate(70,60); g.rotate(-0.5); g.fillRect(-2,0,26,11); g.restore();
  // head
  g.fillStyle=body; g.beginPath(); g.arc(50,34,20,0,7); g.fill();
  g.fillStyle=dark; g.beginPath(); g.arc(50,44,14,0,Math.PI); g.fill();
  if(!dead){
    g.fillStyle='#ffcf5a'; g.shadowColor='#ff8a1a'; g.shadowBlur=10;
    g.beginPath(); g.arc(42,32,4,0,7); g.arc(58,32,4,0,7); g.fill();
    g.shadowBlur=0;
    g.fillStyle='#2a0808'; g.fillRect(46,42,8,4);
  } else {
    g.strokeStyle='#1a0606'; g.lineWidth=2;
    g.beginPath(); g.moveTo(38,28); g.lineTo(52,40); g.moveTo(52,28); g.lineTo(38,40); g.stroke();
    g.beginPath(); g.moveTo(48,40); g.lineTo(52,40); g.stroke();
  }
}
drawZombie(zimg,false); drawZombie(zdead,true);
(function(){ const g=zhit.getContext('2d'); g.drawImage(zimg,0,0);
  g.globalCompositeOperation='source-atop'; g.fillStyle='#fff'; g.fillRect(0,0,100,150); })();

/* ===================== HELPERS ===================== */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function tryMove(nx,ny){
  const r=0.22;
  if(!isWall(nx+r,S.player.y+r)&&!isWall(nx+r,S.player.y-r)&&!isWall(nx-r,S.player.y+r)&&!isWall(nx-r,S.player.y-r)) S.player.x=nx;
  if(!isWall(S.player.x+r,ny+r)&&!isWall(S.player.x+r,ny-r)&&!isWall(S.player.x-r,ny+r)&&!isWall(S.player.x-r,ny-r)) S.player.y=ny;
}
function spawnZombie(){
  const side=(Math.random()*4)|0; let x,y;
  if(side===0){x=Math.random()*MW;y=0.3;}
  else if(side===1){x=MW-0.3;y=Math.random()*MH;}
  else if(side===2){x=Math.random()*MW;y=MH-0.3;}
  else {x=0.3;y=Math.random()*MH;}
  if(isWall(x,y)) return;
  const speed=0.75+Math.min(S.wave,10)*0.05;
  S.zombies.push({x,y,hp:34,max:34,speed,flash:0,dead:false,deathT:0,phase:Math.random()*6.28});
}
function spawnBurst(x,y){
  for(let i=0;i<16;i++){ const a=Math.random()*6.28,s=1+Math.random()*3;
    S.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.4+Math.random()*0.4,max:0.8,size:2+Math.random()*3}); }
}
function waveCount(n){ return Math.min(4+n*2,40); }

/* ===================== INPUT ===================== */
function startGame(){
  S.state='playing'; S.hp=100; S.mag=30; S.reloading=false; S.reloadT=0;
  S.wave=0; S.kills=0; S.score=0; S.zombies.length=0; S.particles.length=0;
  S.player.x=PLAYER_START.x; S.player.y=PLAYER_START.y; S.player.a=PLAYER_START.a;
  S.muzzle=0; S.recoil=0; S.hitFlash=0; S.shake=0; S.waveDelay=1.4; S.bannerT=0;
  $('start').classList.add('hidden'); $('over').classList.add('hidden');
  $('hud').classList.remove('hidden');
  ac();
}
function lock(){ try{ canvas.requestPointerLock&&canvas.requestPointerLock(); }catch(e){} }
function gameOver(){
  S.state='over';
  $('go-score').textContent=S.score; $('go-wave').textContent=S.wave; $('go-kills').textContent=S.kills;
  $('over').classList.remove('hidden'); $('hud').classList.add('hidden');
  try{ document.exitPointerLock&&document.exitPointerLock(); }catch(e){}
}
function showBanner(a,b){ $('banner-1').textContent=a; $('banner-2').textContent=b||'';
  const el=$('banner'); el.classList.remove('show'); void el.offsetWidth; el.classList.add('show'); }

document.addEventListener('mousemove',e=>{
  if(document.pointerLockElement===canvas && S.state==='playing') S.player.a+=e.movementX*0.0022;
});
document.addEventListener('mousedown',e=>{ if(e.button===0 && S.state==='playing') shoot(); });
document.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase(); S.keys[k]=true;
  if(k==='r' && S.state==='playing') reload();
  if((k===' '||k==='enter') && S.state==='start'){ e.preventDefault(); startGame(); lock(); }
  if(k===' ' && S.state==='playing') e.preventDefault();
});
document.addEventListener('keyup',e=>{ S.keys[e.key.toLowerCase()]=false; });
$('start-btn').addEventListener('click',()=>{ startGame(); lock(); });
$('again-btn').addEventListener('click',()=>{ startGame(); lock(); });
canvas.addEventListener('click',()=>{ if(S.state==='playing' && document.pointerLockElement!==canvas) lock(); });

/* ---- touch ---- */
const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
if(isTouch){ $('touch').classList.remove('hidden'); }
const joy=$('joy'), knob=$('joy-knob'); let joyActive=false, joyCX=0, joyCY=0;
function joyPos(e){ const r=joy.getBoundingClientRect(); joyCX=r.left+r.width/2; joyCY=r.top+r.height/2;
  const dx=e.clientX-joyCX, dy=e.clientY-joyCY, d=Math.hypot(dx,dy), m=r.width/2-14;
  const cl=Math.min(d,m), a=Math.atan2(dy,dx); knob.style.left=(50+Math.cos(a)*cl/m*50)+'%'; knob.style.top=(50+Math.sin(a)*cl/m*50)+'%';
  S.keys._mx=Math.cos(a)*(cl/m); S.keys._my=Math.sin(a)*(cl/m); }
joy.addEventListener('touchstart',e=>{joyActive=true;joyPos(e.touches[0]);e.preventDefault();},{passive:false});
joy.addEventListener('touchmove',e=>{ if(joyActive) joyPos(e.touches[0]); e.preventDefault(); },{passive:false});
function joyEnd(){ joyActive=false; S.keys._mx=0;S.keys._my=0; knob.style.left='50%';knob.style.top='50%'; }
joy.addEventListener('touchend',joyEnd); joy.addEventListener('touchcancel',joyEnd);
$('t-fire').addEventListener('touchstart',e=>{ if(S.state==='playing')shoot(); e.preventDefault(); },{passive:false});
$('t-reload').addEventListener('touchstart',e=>{ if(S.state==='playing')reload(); e.preventDefault(); },{passive:false});

/* ===================== ACTIONS ===================== */
function reload(){ if(S.reloading||S.mag>=S.magsize) return; S.reloading=true; S.reloadT=0; sfx.reload(); }
function shoot(){
  if(S.state!=='playing'||S.reloading) return;
  if(S.shootCd>0) return;
  if(S.mag<=0){ reload(); return; }
  S.mag--; S.shootCd=0.11; S.muzzle=0.06; S.recoil=1; S.shake=Math.min(S.shake+4,10);
  sfx.shoot();
  const ca=Math.cos(S.player.a), sa=Math.sin(S.player.a);
  let best=null,bd=1e9;
  for(const z of S.zombies){ if(z.dead) continue;
    const dx=z.x-S.player.x, dy=z.y-S.player.y;
    const t=dx*ca+dy*sa; if(t<0.2) continue;
    const px=S.player.x+t*ca, py=S.player.y+t*sa;
    const d=Math.hypot(z.x-px,z.y-py);
    if(d<0.42 && t<bd){ bd=t; best=z; }
  }
  if(best){ best.hp-=12; best.flash=0.12; sfx.hit();
    if(best.hp<=0){ best.dead=true; best.deathT=0; S.kills++; S.score+=100; spawnBurst(best.x,best.y); sfx.death(); }
  }
}

/* ===================== UPDATE ===================== */
function update(dt){
  if(S.state!=='playing') return;
  const p=S.player;
  // movement
  let mx=0,my=0;
  if(S.keys.w)my-=1; if(S.keys.s)my+=1; if(S.keys.a)mx-=1; if(S.keys.d)mx+=1;
  if(S.keys._mx)mx+=S.keys._mx; if(S.keys._my)my+=S.keys._my;
  const len=Math.hypot(mx,my);
  if(len>0.001){ const sp=3.4*dt, ca=Math.cos(p.a),sa=Math.sin(p.a);
    tryMove(p.x+(ca*mx-sa*my)*(sp/len), p.y+(sa*mx+ca*my)*(sp/len)); }
  // timers
  if(S.shootCd>0)S.shootCd-=dt; if(S.muzzle>0)S.muzzle-=dt;
  S.recoil=Math.max(0,S.recoil-dt*6); S.shake=Math.max(0,S.shake-dt*30);
  if(S.hitFlash>0)S.hitFlash-=dt; if(S.hitCd>0)S.hitCd-=dt;
  if(S.reloading){ S.reloadT+=dt; if(S.reloadT>=S.reloadTime){S.reloading=false;S.mag=S.magsize;} }

  // wave spawning
  if(S.waveDelay>0){ S.waveDelay-=dt;
    if(S.waveDelay<=0){ S.wave++; const n=waveCount(S.wave); for(let i=0;i<n;i++)spawnZombie();
      showBanner('WAVE '+S.wave,'HOSTILES INBOUND · '+n); }
  } else {
    const alive=S.zombies.filter(z=>!z.dead).length;
    if(alive===0){ S.waveDelay=2.4; showBanner('WAVE CLEARED','SCORE '+S.score); }
  }

  // zombies
  for(const z of S.zombies){
    z.phase+=dt*6;
    if(z.flash>0)z.flash-=dt;
    if(z.dead){ z.deathT+=dt; continue; }
    const dx=p.x-z.x, dy=p.y-z.y, d=Math.hypot(dx,dy)||1;
    z.x+=dx/d*z.speed*dt; z.y+=dy/d*z.speed*dt;
    if(d<0.75 && S.hitCd<=0){ S.hp-=10; S.hitCd=0.6; S.hitFlash=0.4; S.shake=Math.min(S.shake+8,14);
      if(S.hp<=0){ S.hp=0; gameOver(); } }
  }
  S.zombies=S.zombies.filter(z=>!(z.dead&&z.deathT>1.2));

  // particles
  for(const q of S.particles){ q.life-=dt; q.x+=q.vx*dt; q.y+=q.vy*dt; q.vx*=0.9; q.vy*=0.9; }
  S.particles=S.particles.filter(q=>q.life>0);
}

/* ===================== RENDER ===================== */
function render(){
  const p=S.player;
  const shx=(Math.random()*2-1)*S.shake, shy=(Math.random()*2-1)*S.shake;
  ctx.save(); ctx.translate(shx,shy);
  ctx.fillStyle='#05070a'; ctx.fillRect(-20,-20,W+40,H+40);

  const dirX=Math.cos(p.a), dirY=Math.sin(p.a);
  const plX=-dirY*0.66, plY=dirX*0.66;
  const posZ=0.5, camX=p.x+dirX*posZ, camY=p.y+dirY*posZ;

  const planeLen=0.66, FOV=0.66;
  const planeX=-dirY*planeLen, planeY=dirX*planeLen;

  // floor
  const fg=ctx.createLinearGradient(0,H/2,0,H);
  fg.addColorStop(0,'#0c120e'); fg.addColorStop(1,'#1a241d');
  ctx.fillStyle=fg; ctx.fillRect(0,H/2,W,H/2);
  // ceiling
  const cg=ctx.createLinearGradient(0,0,0,H/2);
  cg.addColorStop(0,'#04060a'); cg.addColorStop(1,'#0a0f0c');
  ctx.fillStyle=cg; ctx.fillRect(0,0,W,H/2);

  // walls
  if(zbuf.length!==W) zbuf.fill(9999);
  for(let x=0;x<W;x++){
    const camXx=(2*x)/W-1;
    const rdx=dirX+planeX*camXx, rdy=dirY+planeY*camXx;
    let mapX=camX|0, mapY=camY|0;
    const ddx=Math.abs(1/rdx), ddy=Math.abs(1/rdy);
    let stepX,stepY,sdx,sdy;
    if(rdx<0){stepX=-1;sdx=(camX-mapX)*ddx;}else{stepX=1;sdx=(mapX+1-camX)*ddx;}
    if(rdy<0){stepY=-1;sdy=(camY-mapY)*ddy;}else{stepY=1;sdy=(mapY+1-camY)*ddy;}
    let side=0,guard=0;
    while(guard++<128){
      if(sdx<sdy){sdx+=ddx;mapX+=stepX;side=0;} else {sdy+=ddy;mapY+=stepY;side=1;}
      if(isWall(mapX,mapY)) break;
    }
    const perp=side===0?(sdx-ddx):(sdy-ddy);
    const lineH=(H/perp)|0;
    const y0=(H-lineH)/2, y1=(H+lineH)/2;
    zbuf[x]=perp;
    // shade
    let base=side===0?92:74;
    const f=Math.max(0.12, 1-perp/11);
    let r=(base*0.62*f)|0, g=(base*f)|0, b=(base*0.72*f)|0;
    ctx.fillStyle=`rgb(${r},${g},${b})`;
    ctx.fillRect(x,y0,1,y1-y0);
    // subtle vertical edge
    if(side===0){ ctx.fillStyle='rgba(0,0,0,0.18)'; ctx.fillRect(x, y0<0?0:y0, 1, 2); }
  }

  // sprites
  zlist.length=0;
  for(const z of S.zombies){
    const dx=z.x-camX, dy=z.y-camY;
    const inv=1/(planeX*dirY-dirX*planeY);
    const tx=inv*(dirY*dx-dirX*dy), ty=inv*(-planeY*dx+planeX*dy);
    if(ty<=0.1) continue;
    zlist.push({z,tx,ty});
  }
  zlist.sort((a,b)=>b.ty-a.ty);
  const H2=H/2;
  for(const s of zlist){
    const {z,tx,ty}=s;
    const sx=(W/2)*(1+tx/ty);
    const size=Math.abs(H/ty);
    const zw=size*0.62, zh=size*1.0;
    const left=sx-zw/2, top=H2+size/2-zh;
    const img=z.dead?zdead:(z.flash>0?zhit:zimg);
    for(let x=Math.max(0,left|0); x<Math.min(W,left+zw); x++){
      if(ty>=zbuf[x]) continue;
      const u=(x-left)/zw;
      ctx.drawImage(img, u*100,0, 100/zw,150, x,top,1,zh);
    }
  }

  // particles
  for(const q of S.particles){
    const dx=q.x-camX, dy=q.y-camY;
    const inv=1/(planeX*dirY-dirX*planeY);
    const tx=inv*(dirY*dx-dirX*dy), ty=inv*(-planeY*dx+planeX*dy);
    if(ty<=0.1) continue;
    const sx=(W/2)*(1+tx/ty);
    if(sx<-20||sx>W+20) continue;
    const size=(H/ty)*0.03*q.size;
    const a=Math.max(0,q.life/q.max);
    ctx.fillStyle=`rgba(255,${(40+a*40)|0},30,${a})`;
    ctx.beginPath(); ctx.arc(sx,H2+size*0.6,size,0,7); ctx.fill();
  }

  ctx.restore();
  drawGun();
  drawVignette();
}
function drawGun(){
  const bob=Math.sin(performance.now()*0.004)*4*(S.keys.w||S.keys.a||S.keys.d||S.keys.s?1:0.3);
  const rec=S.recoil*26, mx=S.muzzle>0?1:0;
  const cx=W/2, base=H;
  ctx.save(); ctx.translate(cx,base+bob+rec);
  // hands
  ctx.fillStyle='#1c2a22';
  ctx.beginPath(); ctx.ellipse(-90,40,42,30,0.3,0,7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(90,40,42,30,-0.3,0,7); ctx.fill();
  // body
  ctx.fillStyle='#243029';
  ctx.beginPath(); ctx.moveTo(-40,20); ctx.lineTo(40,20); ctx.lineTo(30,120); ctx.lineTo(-30,120); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#2f3d34';
  ctx.fillRect(-26,-6,52,34);
  ctx.fillStyle='#141b17'; ctx.fillRect(-18,-40,36,40);
  ctx.fillStyle='#0d120f'; ctx.fillRect(-9,-52,18,14);
  ctx.strokeStyle='rgba(87,255,158,0.25)'; ctx.lineWidth=2;
  ctx.strokeRect(-26,-6,52,34);
  // muzzle flash
  if(mx){ const fx=0,fy=-64;
    const gr=ctx.createRadialGradient(fx,fy,0,fx,fy,60);
    gr.addColorStop(0,'rgba(255,240,180,0.95)'); gr.addColorStop(0.4,'rgba(255,150,40,0.6)'); gr.addColorStop(1,'rgba(255,80,20,0)');
    ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(fx,fy,60,0,7); ctx.fill();
    ctx.fillStyle='rgba(255,255,220,0.9)';
    for(let i=0;i<6;i++){ const a=i/6*6.28+0.3; ctx.beginPath();
      ctx.moveTo(fx,fy); ctx.lineTo(fx+Math.cos(a)*54,fy+Math.sin(a)*54); ctx.lineTo(fx+Math.cos(a+0.3)*22,fy+Math.sin(a+0.3)*22); ctx.closePath(); ctx.fill(); }
  }
  ctx.restore();
  // crosshair
  ctx.strokeStyle='rgba(87,255,158,0.85)'; ctx.lineWidth=2;
  const ch=10+rec*0.5, gap=6+rec*0.5;
  ctx.beginPath();
  ctx.moveTo(cx-gap,ch); ctx.lineTo(cx-gap,gap);
  ctx.moveTo(cx+gap,ch); ctx.lineTo(cx+gap,gap);
  ctx.moveTo(cx-gap,-ch); ctx.lineTo(cx-gap,-gap);
  ctx.moveTo(cx+gap,-ch); ctx.lineTo(cx+gap,-gap);
  ctx.stroke();
  ctx.fillStyle='rgba(87,255,158,0.9)'; ctx.fillRect(cx-1,cx===cx?0:0,2,2);
}
function drawVignette(){
  const g=ctx.createRadialGradient(W/2,H/2,H*0.3,W/2,H/2,H*0.75);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,0.55)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  if(S.hitFlash>0){ ctx.fillStyle=`rgba(255,30,30,${S.hitFlash*0.5})`; ctx.fillRect(0,0,W,H); }
  if(S.hp<30 && S.state==='playing'){ const p=(Math.sin(performance.now()*0.006)+1)/2;
    ctx.fillStyle=`rgba(255,0,0,${0.06+p*0.08})`; ctx.fillRect(0,0,W,H); }
}

/* ===================== HUD ===================== */
function hud(){
  $('hp-fill').style.width=(S.hp/S.maxhp*100)+'%';
  $('hp-num').textContent=S.hp;
  $('hpbar').classList.toggle('low',S.hp<35);
  $('hp-fill').classList.toggle('low',S.hp<35);
  $('wave-num').textContent=S.wave||1;
  $('score-num').textContent=S.score;
  $('kill-num').textContent='KILLS '+S.kills;
  $('ammo-mag').textContent=S.mag;
  $('ammo').classList.toggle('low',S.mag<=6);
  $('ammo-reload').textContent=S.reloading?'RELOADING':(S.mag===0?'EMPTY — PRESS R':'');
}

/* ===================== LOOP ===================== */
function frame(t){
  if(!S.lastT)S.lastT=t;
  let dt=(t-S.lastT)/1000; S.lastT=t;
  dt=Math.min(dt,0.05);
  update(dt);
  render();
  if(S.state==='playing') hud();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>

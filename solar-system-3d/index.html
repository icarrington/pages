<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Solar System 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#04060d; --ink:#eaf0ff; --muted:#93a0c4; --faint:#5a6690;
    --line:rgba(130,155,225,.16); --line-2:rgba(130,155,225,.30);
    --panel:rgba(9,14,30,.62); --panel-2:rgba(14,20,42,.72);
    --accent:#ffb24d; --accent-2:#5fd0ff; --accent-3:#ff7a5c;
    --good:#63e6a0; --warn:#ffcf6b; --bad:#ff6b6b;
    --display:'Chakra Petch',ui-sans-serif,system-ui,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
    --sans:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  #scene{position:fixed;inset:0;display:block;touch-action:none;cursor:grab}
  #scene:active{cursor:grabbing}
  .vignette{position:fixed;inset:0;pointer-events:none;z-index:2;
    background:radial-gradient(120% 90% at 50% 42%,transparent 55%,rgba(2,4,12,.55) 100%)}
  .hud{position:fixed;inset:0;z-index:5;pointer-events:none;
    padding:clamp(12px,2.4vw,26px);display:flex;flex-direction:column;justify-content:space-between;gap:14px}
  .hud>*{pointer-events:auto}

  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
  .brand{display:flex;gap:14px;align-items:center;min-width:0}
  .brand .mark{width:44px;height:44px;flex:0 0 auto;filter:drop-shadow(0 0 14px rgba(255,178,77,.45))}
  .brand .txt h1{font-family:var(--display);font-weight:700;letter-spacing:.16em;
    font-size:clamp(15px,2.3vw,21px);margin:0;line-height:1}
  .brand .txt p{font-family:var(--mono);font-size:10.5px;letter-spacing:.22em;color:var(--muted);margin:5px 0 0}
  .brand .txt .tag{color:var(--accent-2)}
  .status{display:flex;align-items:center;gap:14px;font-family:var(--mono);font-size:11px;
    letter-spacing:.14em;color:var(--muted);border:1px solid var(--line);border-radius:3px;
    padding:9px 13px;background:var(--panel);backdrop-filter:blur(9px)}
  .status .live{width:8px;height:8px;border-radius:50%;background:var(--good);
    box-shadow:0 0 0 0 rgba(99,230,160,.6);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(99,230,160,.55)}70%{box-shadow:0 0 0 9px rgba(99,230,160,0)}100%{box-shadow:0 0 0 0 rgba(99,230,160,0)}}

  .bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
  .controls{display:flex;align-items:center;gap:20px;flex-wrap:wrap;border:1px solid var(--line);
    background:var(--panel);backdrop-filter:blur(9px);border-radius:4px;padding:13px 17px;max-width:min(560px,100%)}
  .ctrl{display:flex;flex-direction:column;gap:7px;min-width:0}
  .ctrl .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:var(--faint)}
  .ctrl .val{font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:.08em}
  input[type=range]{-webkit-appearance:none;appearance:none;width:190px;max-width:42vw;height:4px;border-radius:4px;
    background:linear-gradient(90deg,var(--accent-2),var(--accent));outline:none;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;
    background:var(--ink);border:3px solid var(--accent);box-shadow:0 0 12px rgba(255,178,77,.6);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--ink);
    border:3px solid var(--accent);box-shadow:0 0 12px rgba(255,178,77,.6);cursor:pointer}
  .btn{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--muted);
    background:transparent;border:1px solid var(--line-2);border-radius:3px;padding:9px 13px;cursor:pointer;
    transition:.18s;white-space:nowrap}
  .btn:hover{color:var(--ink);border-color:var(--accent);transform:translateY(-1px)}
  .btn[aria-pressed="true"]{color:#04060d;background:var(--accent);border-color:var(--accent);
    box-shadow:0 0 16px rgba(255,178,77,.4)}
  .btn .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:8px;vertical-align:1px;opacity:.5}
  .btn[aria-pressed="true"] .dot{opacity:1;box-shadow:0 0 8px rgba(0,0,0,.4)}

  .legend{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--muted);
    border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(9px);border-radius:4px;
    padding:11px 15px;display:flex;gap:16px;flex-wrap:wrap}
  .legend b{color:var(--ink);font-weight:600}
  .legend span{display:inline-flex;align-items:center;gap:7px}
  .legend i{width:6px;height:6px;border-radius:50%;background:var(--accent-2);display:inline-block}

  /* Detail card */
  .card{position:fixed;top:0;right:0;height:100%;width:min(384px,92vw);z-index:20;
    background:linear-gradient(180deg,var(--panel-2),rgba(7,11,26,.9));backdrop-filter:blur(14px);
    border-left:1px solid var(--line-2);box-shadow:-30px 0 70px rgba(0,0,0,.55);
    transform:translateX(105%);transition:transform .5s cubic-bezier(.16,1,.3,1);
    display:flex;flex-direction:column;overflow-y:auto}
  .card.open{transform:translateX(0)}
  .card::before{content:"";position:absolute;left:-1px;top:0;bottom:0;width:2px;
    background:linear-gradient(180deg,var(--accent),transparent 60%)}
  .card .close{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;
    border:1px solid var(--line-2);background:rgba(255,255,255,.03);color:var(--muted);cursor:pointer;
    font-size:15px;line-height:1;transition:.18s}
  .card .close:hover{color:var(--ink);border-color:var(--accent);transform:rotate(90deg)}
  .card .body{padding:26px 24px 30px}
  .card .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.28em;color:var(--accent);margin-bottom:14px}
  .card h2{font-family:var(--display);font-weight:700;font-size:clamp(30px,7vw,44px);margin:0;letter-spacing:.02em;line-height:.95}
  .card .sub{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--muted);margin:10px 0 22px}
  .card .swatch{width:100%;height:6px;border-radius:6px;margin-bottom:24px;
    background:linear-gradient(90deg,var(--c1),var(--c2));box-shadow:0 0 20px -4px var(--c1)}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);
    border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-bottom:24px}
  .stat{background:rgba(8,12,28,.7);padding:14px 15px}
  .stat .k{font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:var(--faint);margin-bottom:7px}
  .stat .v{font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:.01em}
  .stat .v small{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.06em}
  .fact{border-left:2px solid var(--accent);padding:4px 0 4px 15px;margin:0}
  .fact .k{font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--faint);margin-bottom:8px}
  .fact p{margin:0;font-size:14.5px;line-height:1.6;color:#cdd6f2}

  /* Planet labels */
  .label{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;color:var(--ink);
    text-transform:uppercase;white-space:nowrap;pointer-events:none;transform:translateY(-2px);
    background:rgba(6,10,24,.55);border:1px solid var(--line);border-radius:20px;padding:3px 9px;
    backdrop-filter:blur(3px);text-shadow:0 1px 6px rgba(0,0,0,.8)}
  .label::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;
    background:var(--accent-2);margin-right:6px;vertical-align:1px;box-shadow:0 0 6px var(--accent-2)}
  .labels-off .label{display:none}

  .boot{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;gap:18px;
    align-items:center;justify-content:center;background:var(--bg);transition:opacity .6s;
    font-family:var(--mono);letter-spacing:.24em;font-size:11px;color:var(--muted)}
  .boot.hide{opacity:0;pointer-events:none}
  .boot .r{width:34px;height:34px;border:2px solid var(--line-2);border-top-color:var(--accent);
    border-radius:50%;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  @media (max-width:720px){
    .legend{display:none}
    .status .txt{display:none}
    .card{width:100vw;height:auto;max-height:74vh;top:auto;bottom:0;transform:translateY(105%);
      border-left:none;border-top:1px solid var(--line-2);border-radius:16px 16px 0 0;
      box-shadow:0 -30px 70px rgba(0,0,0,.6)}
    .card.open{transform:translateY(0)}
    .card::before{left:0;right:0;top:-1px;bottom:auto;width:auto;height:2px;
      background:linear-gradient(90deg,var(--accent),transparent)}
    .controls{max-width:100%}
    input[type=range]{width:100%}
    .ctrl.slider{flex:1 1 100%}
  }
</style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div class="vignette"></div>

  <div class="hud">
    <div class="top">
      <div class="brand">
        <svg class="mark" viewBox="0 0 44 44" fill="none" aria-hidden="true">
          <circle cx="22" cy="22" r="9" fill="#ffb24d"/>
          <circle cx="22" cy="22" r="9" fill="url(#g)" opacity=".4"/>
          <ellipse cx="22" cy="22" rx="19" ry="7" stroke="#5fd0ff" stroke-width="1.4" transform="rotate(-24 22 22)"/>
          <circle cx="38.5" cy="14" r="2.4" fill="#5fd0ff"/>
          <defs><radialGradient id="g" cx="0.4" cy="0.4" r="0.7"><stop stop-color="#fff"/><stop offset="1" stop-color="#ff7a5c"/></radialGradient></defs>
        </svg>
        <div class="txt">
          <h1>SOLAR SYSTEM</h1>
          <p>INTERACTIVE ORBITAL VIEW <span class="tag">// 3D</span></p>
        </div>
      </div>
      <div class="status">
        <span class="live"></span>
        <span class="txt">SYSTEM NOMINAL</span>
      </div>
    </div>

    <div class="bottom">
      <div class="controls">
        <div class="ctrl slider">
          <div style="display:flex;justify-content:space-between;align-items:baseline">
            <span class="lbl">ORBIT SPEED</span>
            <span class="val" id="speedVal">1.0×</span>
          </div>
          <input type="range" id="speed" min="0" max="10" step="0.1" value="1" aria-label="Orbit speed">
        </div>
        <div class="ctrl">
          <span class="lbl">LABELS</span>
          <button class="btn" id="labelsBtn" aria-pressed="true"><span class="dot"></span>NAME TAGS</button>
        </div>
        <div class="ctrl">
          <span class="lbl">VIEW</span>
          <button class="btn" id="resetBtn">RESET CAM</button>
        </div>
      </div>
      <div class="legend">
        <span><i></i><b>DRAG</b> ROTATE</span>
        <span><i></i><b>R-DRAG</b> PAN</span>
        <span><i></i><b>SCROLL</b> ZOOM</span>
        <span><i></i><b>TAP</b> INSPECT</span>
      </div>
    </div>
  </div>

  <aside class="card" id="card" aria-hidden="true">
    <button class="close" id="closeBtn" aria-label="Close details">✕</button>
    <div class="body" id="cardBody"></div>
  </aside>

  <div class="boot" id="boot"><div class="r"></div><div>INITIALISING ORBITS…</div></div>

<script type="importmap">
{
  "imports":{
    "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04060d);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 4000);
const HOME = new THREE.Vector3(0, 34, 104);
camera.position.copy(HOME);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 8;
controls.maxDistance = 400;
controls.target.set(0,0,0);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
labelRenderer.domElement.style.position = 'fixed';
labelRenderer.domElement.style.inset = '0';
labelRenderer.domElement.style.pointerEvents = 'none';
document.body.appendChild(labelRenderer.domElement);

/* ---------- Lighting ---------- */
scene.add(new THREE.AmbientLight(0x223055, 0.35));
const sunLight = new THREE.PointLight(0xfff2d0, 3.2, 0, 0);
scene.add(sunLight);

/* ---------- Procedural textures ---------- */
function canvasTex(draw, size=256){
  const c = document.createElement('canvas'); c.width=c.height=size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function hash(n){ const x = Math.sin(n*12.9898)*43758.5453; return x - Math.floor(x); }
function noiseTex(base, spots, spotColor, size=256){
  return canvasTex((ctx,s)=>{
    ctx.fillStyle=base; ctx.fillRect(0,0,s,s);
    for(let i=0;i<spots;i++){
      const x=hash(i*1.3)*s, y=hash(i*2.7)*s, r=hash(i*3.1)*s*0.06+2;
      ctx.globalAlpha=0.05+hash(i*5.2)*0.14; ctx.fillStyle=spotColor;
      ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
    }
    ctx.globalAlpha=1;
  }, size);
}
function bandedTex(bands, size=256){
  return canvasTex((ctx,s)=>{
    const g=ctx.createLinearGradient(0,0,0,s);
    bands.forEach(([o,c])=>g.addColorStop(o,c));
    ctx.fillStyle=g; ctx.fillRect(0,0,s,s);
    for(let i=0;i<1200;i++){
      const y=hash(i*0.7)*s, x=hash(i*1.9)*s, w=hash(i*3.3)*s*0.5;
      ctx.globalAlpha=0.04+hash(i*4.1)*0.08;
      ctx.fillStyle=hash(i*6.1)>0.5?'#ffffff':'#000000';
      ctx.fillRect(x,y,w,1.5);
    }
    ctx.globalAlpha=1;
  }, size);
}
function ringTex(){
  const c=document.createElement('canvas'); c.width=256; c.height=8;
  const x=c.getContext('2d');
  for(let i=0;i<256;i++){
    const a=Math.max(0,0.15+Math.sin(i*0.25)*0.25+hash(i)*0.25)*(i<18?0.2:1);
    x.globalAlpha=Math.min(1,a); x.fillStyle='#e8d3a8'; x.fillRect(i,0,1,8);
  }
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}
function glowTex(){
  const c=document.createElement('canvas'); c.width=c.height=128;
  const x=c.getContext('2d');
  const g=x.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,'rgba(255,240,210,1)');
  g.addColorStop(0.25,'rgba(255,190,110,0.85)');
  g.addColorStop(0.55,'rgba(255,140,60,0.28)');
  g.addColorStop(1,'rgba(255,120,40,0)');
  x.fillStyle=g; x.fillRect(0,0,128,128);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}

/* ---------- Starfield ---------- */
function stars(count, size, spread, color, opacity){
  const g=new THREE.BufferGeometry();
  const pos=new Float32Array(count*3);
  for(let i=0;i<count;i++){
    const r=spread*(0.55+0.45*Math.random());
    const t=Math.random()*Math.PI*2, p=Math.acos(2*Math.random()-1);
    pos[i*3]=r*Math.sin(p)*Math.cos(t);
    pos[i*3+1]=r*Math.cos(p)*0.7;
    pos[i*3+2]=r*Math.sin(p)*Math.sin(t);
  }
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const m=new THREE.PointsMaterial({size, color, transparent:true, opacity, sizeAttenuation:true, depthWrite:false});
  const pts=new THREE.Points(g,m); scene.add(pts); return pts;
}
const starA = stars(2600, 0.9, 900, 0xffffff, 0.9);
const starB = stars(1400, 1.6, 950, 0x9fd0ff, 0.5);
const starC = stars(900, 1.9, 980, 0xffd9a0, 0.45);

/* ---------- Sun ---------- */
const sun = new THREE.Mesh(
  new THREE.SphereGeometry(6, 64, 64),
  new THREE.MeshBasicMaterial({ color:0xffd27a, map:noiseTex('#ffcf6b', 4000, '#ff8a3c', 512) })
);
sun.userData = {
  name:'Sun', type:'G-type main-sequence star',
  diameter:'1,392,700 km', distance:'— (center of system)',
  period:'— (system barycenter)', moons:'0',
  fact:'The Sun holds about 99.86% of the total mass of the entire solar system — every planet, moon and asteroid combined is a rounding error next to it.',
  c1:'#ffcf6b', c2:'#ff7a3c'
};
scene.add(sun);
const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map:glowTex(), color:0xffb24d, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false }));
glow.scale.set(30,30,1); scene.add(glow);
const glow2 = new THREE.Sprite(new THREE.SpriteMaterial({ map:glowTex(), color:0xff8a3c, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false }));
glow2.scale.set(52,52,1); scene.add(glow2);

/* ---------- Planets ---------- */
const PLANETS = [
  { name:'Mercury', size:0.7, dist:14, period:0.24, color:0x9c8b7a,
    tex:noiseTex('#8a7a6a', 4200, '#5c4f42'),
    type:'Terrestrial planet', diameter:'4,879 km', distance:'57.9 million km',
    periodTxt:'88 days', moons:'0',
    fact:'A year on Mercury is just 88 days — yet a single solar day (sunrise to sunrise) lasts 176 Earth days, twice as long as its year.',
    c1:'#b8a488', c2:'#6b5a48' },
  { name:'Venus', size:1.4, dist:21, period:0.62, color:0xe6c884,
    tex:noiseTex('#d9bd82', 3200, '#b89a5e'),
    type:'Terrestrial planet', diameter:'12,104 km', distance:'108.2 million km',
    periodTxt:'225 days', moons:'0',
    fact:'Venus spins backwards and so slowly that its day is longer than its year — it rotates once every 243 Earth days, but orbits the Sun in only 225.',
    c1:'#f0d9a0', c2:'#b98a4e' },
  { name:'Earth', size:1.5, dist:29, period:1.0, color:0x4a90d9,
    tex:noiseTex('#2f6fd0', 5200, '#2f8f4a'),
    type:'Terrestrial planet · home', diameter:'12,742 km', distance:'149.6 million km',
    periodTxt:'365.25 days', moons:'1',
    fact:'Earth is the only known world with stable liquid water on its surface — and the only place in the universe where we currently know life exists.',
    c1:'#5aa0ff', c2:'#1f5fd0' },
  { name:'Mars', size:1.0, dist:38, period:1.88, color:0xc1502e,
    tex:noiseTex('#b5502e', 4600, '#7a3320'),
    type:'Terrestrial planet', diameter:'6,779 km', distance:'227.9 million km',
    periodTxt:'687 days', moons:'2',
    fact:'Mars hosts Olympus Mons, the tallest volcano in the solar system — about 2.5× the height of Mount Everest, with a base 3× wider than France.',
    c1:'#e0704a', c2:'#8a3a20' },
  { name:'Jupiter', size:3.9, dist:60, period:11.86, color:0xd8b48a,
    tex:bandedTex([[0,'#caa07a'],[0.2,'#e2c49a'],[0.35,'#b98a5e'],[0.5,'#e8d0a8'],[0.65,'#c0905f'],[0.8,'#d8b48a'],[1,'#a97a52']]),
    type:'Gas giant', diameter:'139,820 km', distance:'778.5 million km',
    periodTxt:'11.9 years', moons:'95',
    fact:'Jupiter is the largest planet in the solar system — so massive that more than 1,300 Earths could fit inside it.',
    c1:'#e8c89a', c2:'#a97a52' },
  { name:'Saturn', size:3.3, dist:84, period:29.46, color:0xe0c99a,
    tex:bandedTex([[0,'#e6d3a8'],[0.25,'#d4bd8c'],[0.5,'#efe0b8'],[0.75,'#cbb488'],[1,'#dcc99f']]),
    type:'Gas giant', diameter:'116,460 km', distance:'1.43 billion km',
    periodTxt:'29.5 years', moons:'146',
    fact:'Saturn is less dense than water — if you could find an ocean big enough, the whole planet would float.',
    c1:'#efe0b8', c2:'#c2a878' },
  { name:'Uranus', size:2.4, dist:108, period:84.01, color:0x9fe0e0,
    tex:noiseTex('#8fd4d8', 2600, '#6bb8c0'),
    type:'Ice giant', diameter:'50,724 km', distance:'2.87 billion km',
    periodTxt:'84 years', moons:'28',
    fact:'Uranus rolls around the Sun on its side, tilted about 98° — so it effectively orbits while lying almost flat.',
    c1:'#b8eef0', c2:'#5fb8c4' },
  { name:'Neptune', size:2.3, dist:130, period:164.8, color:0x3f6fd0,
    tex:noiseTex('#3f6fd0', 3200, '#2b4fa0'),
    type:'Ice giant', diameter:'49,244 km', distance:'4.5 billion km',
    periodTxt:'164.8 years', moons:'16',
    fact:'Neptune has the fastest winds in the solar system, gusting up to about 2,100 km/h — more than five times the speed of a hurricane.',
    c1:'#5f8fe0', c2:'#2b4fa0' },
];

const pickables = [sun];
const orbitGroup = new THREE.Group();
orbitGroup.rotation.x = 0.16; // slight orbital-plane tilt
scene.add(orbitGroup);

function makeLabel(text){
  const el = document.createElement('div');
  el.className = 'label'; el.textContent = text;
  return new CSS2DObject(el);
}

const orbits = [];
PLANETS.forEach((p, i)=>{
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(p.size, 48, 48),
    new THREE.MeshStandardMaterial({ map:p.tex, roughness:0.92, metalness:0.02, color:0xffffff })
  );
  const angle = i * 1.7;
  const pivot = new THREE.Object3D();
  pivot.rotation.y = angle;
  mesh.position.x = p.dist;
  pivot.add(mesh);
  orbitGroup.add(pivot);

  // orbit path
  const pts=[];
  for(let a=0;a<=128;a++){ const t=a/128*Math.PI*2; pts.push(new THREE.Vector3(Math.cos(t)*p.dist,0,Math.sin(t)*p.dist)); }
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color:0x3a4a7a, transparent:true, opacity:0.28 }));
  orbitGroup.add(line);

  const label = makeLabel(p.name);
  label.position.set(0, p.size + 1.1, 0);
  mesh.add(label);

  // saturn ring
  if(p.name === 'Saturn'){
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(p.size*1.35, p.size*2.35, 96),
      new THREE.MeshBasicMaterial({ map:ringTex(), side:THREE.DoubleSide, transparent:true, opacity:0.92, color:0xffffff })
    );
    ring.rotation.x = Math.PI/2 - 0.42;
    mesh.add(ring);
  }

  mesh.userData = {
    name:p.name, type:p.type, diameter:p.diameter, distance:p.distance,
    period:p.periodTxt, moons:p.moons, fact:p.fact, c1:p.c1, c2:p.c2,
    speed: (0.9 / p.period) * 0.42
  };
  orbits.push({ pivot, speed:mesh.userData.speed });
  pickables.push(mesh);
});

/* ---------- Interaction: click vs drag ---------- */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let down = null;
const THRESH = 8; // px movement threshold

canvas.addEventListener('pointerdown', e=>{ down = { x:e.clientX, y:e.clientY, t:performance.now() }; });
canvas.addEventListener('pointerup', e=>{
  if(!down) return;
  const moved = Math.hypot(e.clientX-down.x, e.clientY-down.y);
  const dt = performance.now()-down.t;
  down = null;
  if(moved > THRESH || dt > 600) return; // it was a drag
  pointer.x = (e.clientX/innerWidth)*2 - 1;
  pointer.y = -(e.clientY/innerHeight)*2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hit = raycaster.intersectObjects(pickables, false)[0];
  if(hit) select(hit.object);
});

/* ---------- Detail card ---------- */
const card = document.getElementById('card');
const cardBody = document.getElementById('cardBody');
function select(obj){
  const d = obj.userData;
  cardBody.innerHTML = `
    <div class="eyebrow">${d.type.toUpperCase()}</div>
    <h2>${d.name}</h2>
    <div class="sub" style="margin-top:12px">SOLAR SYSTEM / OBJECT</div>
    <div class="swatch" style="--c1:${d.c1};--c2:${d.c2}"></div>
    <div class="stats">
      <div class="stat"><div class="k">DIAMETER</div><div class="v">${d.diameter}</div></div>
      <div class="stat"><div class="k">DIST. FROM SUN</div><div class="v">${d.distance}</div></div>
      <div class="stat"><div class="k">ORBITAL PERIOD</div><div class="v">${d.period}</div></div>
      <div class="stat"><div class="k">MOONS</div><div class="v">${d.moons}</div></div>
    </div>
    <div class="fact"><div class="k">FUN FACT</div><p>${d.fact}</p></div>`;
  card.classList.add('open');
  card.setAttribute('aria-hidden','false');
}
function closeCard(){ card.classList.remove('open'); card.setAttribute('aria-hidden','true'); }
document.getElementById('closeBtn').addEventListener('click', closeCard);
addEventListener('keydown', e=>{ if(e.key==='Escape') closeCard(); });

/* ---------- Controls UI ---------- */
let speed = 1;
const speedInput = document.getElementById('speed');
const speedVal = document.getElementById('speedVal');
speedInput.addEventListener('input', ()=>{
  speed = parseFloat(speedInput.value);
  speedVal.textContent = speed.toFixed(1) + '×';
});

const labelsBtn = document.getElementById('labelsBtn');
labelsBtn.addEventListener('click', ()=>{
  const on = labelsBtn.getAttribute('aria-pressed') === 'true';
  labelsBtn.setAttribute('aria-pressed', String(!on));
  document.body.classList.toggle('labels-off', on);
});

let camTween = null;
document.getElementById('resetBtn').addEventListener('click', ()=>{
  camTween = { from:camera.position.clone(), to:HOME.clone(), fromT:controls.target.clone(), toT:new THREE.Vector3(0,0,0), t:0 };
});

/* ---------- Resize ---------- */
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ---------- Animate ---------- */
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  orbits.forEach(o=>{ o.pivot.rotation.y += o.speed * speed * dt; });
  sun.rotation.y += dt * 0.05;
  starA.rotation.y += dt * 0.004;
  starB.rotation.y -= dt * 0.002;
  glow.material.rotation += dt * 0.02;

  if(camTween){
    camTween.t = Math.min(1, camTween.t + dt*2.2);
    const e = 1 - Math.pow(1-camTween.t, 3);
    camera.position.lerpVectors(camTween.from, camTween.to, e);
    controls.target.lerpVectors(camTween.fromT, camTween.toT, e);
    if(camTween.t >= 1) camTween = null;
  }

  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
animate();

// hide boot
requestAnimationFrame(()=> requestAnimationFrame(()=> document.getElementById('boot').classList.add('hide')));
</script>
</body>
</html>

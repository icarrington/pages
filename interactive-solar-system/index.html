<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Interactive Solar System</title>
<style>
  :root{
    --bg-0:#03040c; --bg-1:#070b1e; --bg-2:#0c1330;
    --ink:#eef2ff; --muted:#98a4cf; --faint:#63709e;
    --line:rgba(150,165,220,.16); --line-2:rgba(150,165,220,.3);
    --panel:rgba(11,16,38,.82);
    --sun:#ffcf6b; --saturn:#e9d29a;
    --accent:#79e0ff; --accent-2:#ffd27a;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Code","JetBrains Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; font-family:var(--sans); color:var(--ink);
    background:
      radial-gradient(120% 80% at 12% 8%, rgba(255,180,90,.10), transparent 55%),
      radial-gradient(140% 120% at 88% 108%, rgba(60,120,220,.14), transparent 60%),
      radial-gradient(100% 100% at 50% 50%, var(--bg-1), var(--bg-0) 78%);
    overflow:hidden; -webkit-font-smoothing:antialiased;
  }
  .app{position:fixed; inset:0; display:flex; flex-direction:column; height:100vh; height:100dvh; overflow:hidden}

  /* ---------- header ---------- */
  header{
    position:relative; z-index:6;
    display:flex; align-items:flex-end; justify-content:space-between; gap:18px;
    padding:clamp(14px,2.4vw,26px) clamp(16px,3vw,34px) 12px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, rgba(6,9,22,.72), rgba(6,9,22,0));
    backdrop-filter:blur(3px);
  }
  .kicker{
    font-family:var(--mono); font-size:.66rem; letter-spacing:.34em; text-transform:uppercase;
    color:var(--accent); display:flex; align-items:center; gap:.6em; margin:0 0 .55rem;
  }
  .kicker::before{content:""; width:26px; height:1px; background:linear-gradient(90deg,var(--accent),transparent)}
  h1{
    margin:0; font-weight:800; line-height:.95; letter-spacing:-.02em;
    font-size:clamp(1.9rem,4.6vw,3.5rem);
    background:linear-gradient(180deg,#fff 30%,#c9d5ff 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .sub{margin:.5rem 0 0; color:var(--muted); font-size:clamp(.82rem,1.6vw,.98rem)}
  .sub b{color:var(--ink); font-weight:600}
  .head-right{display:flex; flex-direction:column; align-items:flex-end; gap:8px; flex:none}
  .readout{
    font-family:var(--mono); font-size:.62rem; letter-spacing:.22em; color:var(--faint);
    display:flex; align-items:center; gap:.6em; white-space:nowrap;
  }
  .live{width:7px; height:7px; border-radius:50%; background:#5fe3a1; box-shadow:0 0 10px #5fe3a1; animation:blink 2s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

  /* ---------- controls ---------- */
  .controls{
    position:relative; z-index:6;
    display:flex; flex-wrap:wrap; gap:clamp(12px,2vw,26px); align-items:center;
    padding:12px clamp(16px,3vw,34px);
    border-bottom:1px solid var(--line);
    background:rgba(8,12,28,.5);
  }
  .ctrl{display:flex; align-items:center; gap:12px}
  .ctrl-label{font-family:var(--mono); font-size:.62rem; letter-spacing:.24em; text-transform:uppercase; color:var(--faint); flex:none}
  .ctrl-val{font-family:var(--mono); font-size:.82rem; color:var(--accent); min-width:3.2ch; text-align:right}

  input[type=range]{
    -webkit-appearance:none; appearance:none; width:clamp(120px,18vw,220px); height:4px;
    border-radius:99px; background:linear-gradient(90deg,var(--accent) 0 var(--fill,50%), rgba(150,165,220,.22) var(--fill,50%));
    outline:none; cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:18px; height:18px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff,var(--accent));
    box-shadow:0 0 0 4px rgba(121,224,255,.15),0 0 14px rgba(121,224,255,.6); border:none;
    transition:transform .15s;
  }
  input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.15)}
  input[type=range]::-moz-range-thumb{
    width:18px; height:18px; border-radius:50%; border:none;
    background:radial-gradient(circle at 35% 30%,#fff,var(--accent));
    box-shadow:0 0 14px rgba(121,224,255,.6);
  }

  .toggle{
    display:inline-flex; align-items:center; gap:10px; cursor:pointer; user-select:none;
    font-family:var(--mono); font-size:.66rem; letter-spacing:.2em; text-transform:uppercase; color:var(--muted);
    background:rgba(150,165,220,.06); border:1px solid var(--line); border-radius:99px; padding:8px 14px 8px 10px;
    transition:.2s;
  }
  .toggle:hover{border-color:var(--line-2); color:var(--ink)}
  .toggle .track{width:34px; height:18px; border-radius:99px; background:rgba(150,165,220,.2); position:relative; transition:.25s}
  .toggle .knob{position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%; background:#cdd6f5; transition:.25s}
  .toggle[aria-pressed="true"]{color:var(--ink); border-color:var(--accent); box-shadow:0 0 16px rgba(121,224,255,.18)}
  .toggle[aria-pressed="true"] .track{background:rgba(121,224,255,.35)}
  .toggle[aria-pressed="true"] .knob{left:18px; background:var(--accent); box-shadow:0 0 10px var(--accent)}

  /* ---------- stage ---------- */
  .stage{position:relative; flex:1; overflow:hidden; touch-action:pan-y; cursor:grab}
  .stage.dragging{cursor:grabbing}
  .stage::after{content:""; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(3,4,12,.55) 100%)}
  .stars{position:absolute; inset:0; width:100%; height:100%; display:block}
  .star{transform-box:fill-box; transform-origin:center; animation:tw var(--d,3s) ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
  .orbit{fill:none; stroke:rgba(150,165,220,.14); stroke-width:1; stroke-dasharray:2 7}
  .orbit.active{stroke:var(--accent); stroke-opacity:.55; stroke-dasharray:4 6; animation:flow 1.1s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-20}}
  .sun{cursor:pointer}
  .sun-core{transform-box:fill-box; transform-origin:center; animation:pulse 4.5s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
  .sun-halo{transform-box:fill-box; transform-origin:center; animation:halo 4.5s ease-in-out infinite}
  @keyframes halo{0%,100%{opacity:.75}50%{opacity:1}}

  .planet{cursor:pointer}
  .planet .disc{transition:transform .25s cubic-bezier(.2,.8,.2,1); transform-box:fill-box; transform-origin:center}
  .planet .ring{transition:transform .25s cubic-bezier(.2,.8,.2,1); transform-box:fill-box; transform-origin:center}
  .planet .halo{opacity:0; transition:opacity .25s; transform-box:fill-box; transform-origin:center}
  .planet .ring-halo{opacity:0; transition:opacity .25s; transform-box:fill-box; transform-origin:center}
  .planet:hover .disc,.planet.active .disc{transform:scale(1.2)}
  .planet:hover .ring,.planet.active .ring{transform:scale(1.2)}
  .planet:hover .halo,.planet.active .halo{opacity:.9}
  .planet:hover .ring-halo,.planet.active .ring-halo{opacity:.5}

  .label{
    pointer-events:none; font-family:var(--mono); font-size:11px; letter-spacing:.18em;
    fill:var(--muted); text-transform:uppercase; opacity:0; transition:opacity .35s;
    paint-order:stroke; stroke:rgba(3,4,12,.85); stroke-width:3px; stroke-linejoin:round;
  }
  .label.show{opacity:1}
  .label.active{fill:var(--accent)}

  .tip{
    position:absolute; z-index:5; pointer-events:none; white-space:nowrap;
    font-family:var(--mono); font-size:.72rem; letter-spacing:.14em; text-transform:uppercase;
    color:#04121a; background:var(--accent); padding:6px 12px; border-radius:8px;
    box-shadow:0 6px 20px rgba(0,0,0,.4); transform:translate(-50%,-150%);
    opacity:0; transition:opacity .15s;
  }
  .tip.show{opacity:1}
  .tip::after{content:""; position:absolute; left:50%; top:100%; transform:translateX(-50%);
    border:6px solid transparent; border-top-color:var(--accent)}

  /* ---------- info panel ---------- */
  .panel{
    position:absolute; z-index:7; top:0; right:0; height:100%;
    width:min(400px,92vw);
    background:var(--panel); backdrop-filter:blur(14px);
    border-left:1px solid var(--line-2);
    box-shadow:-30px 0 60px rgba(0,0,0,.5);
    transform:translateX(105%); transition:transform .42s cubic-bezier(.2,.85,.25,1);
    display:flex; flex-direction:column; overflow:hidden;
  }
  .panel.open{transform:translateX(0)}
  .panel-top{display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--line)}
  .panel-top .tag{font-family:var(--mono); font-size:.62rem; letter-spacing:.28em; text-transform:uppercase; color:var(--faint)}
  .close{
    width:34px; height:34px; border-radius:10px; border:1px solid var(--line); background:rgba(150,165,220,.06);
    color:var(--muted); font-size:1.1rem; cursor:pointer; line-height:1; transition:.2s;
  }
  .close:hover{color:#ff9c9c; border-color:rgba(255,140,140,.5); transform:rotate(90deg)}
  .panel-body{padding:22px 22px 26px; overflow-y:auto; flex:1}
  .panel-body::-webkit-scrollbar{width:8px}
  .panel-body::-webkit-scrollbar-thumb{background:rgba(150,165,220,.25); border-radius:99px}

  .p-head{display:flex; align-items:center; gap:16px; margin-bottom:20px}
  .p-swatch{width:56px; height:56px; border-radius:50%; flex:none; position:relative;
    box-shadow:0 0 24px -4px var(--sc, #fff); background:radial-gradient(circle at 34% 30%, rgba(255,255,255,.5), transparent 45%), var(--sc,#888)}
  .p-swatch.ringed::after{content:""; position:absolute; left:-22%; right:-22%; top:50%; height:12px;
    transform:translateY(-50%) rotate(-18deg); border-radius:50%; border:2px solid var(--sc); border-color:rgba(233,210,154,.7)}
  .p-name{margin:0; font-size:1.7rem; font-weight:800; letter-spacing:-.01em; line-height:1}
  .p-class{margin:.35rem 0 0; color:var(--muted); font-size:.82rem}

  .stats{display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--line);
    border:1px solid var(--line); border-radius:14px; overflow:hidden}
  .stat{background:rgba(8,12,28,.55); padding:13px 14px}
  .stat .k{font-family:var(--mono); font-size:.58rem; letter-spacing:.2em; text-transform:uppercase; color:var(--faint); margin-bottom:6px}
  .stat .v{font-size:1.02rem; font-weight:600; letter-spacing:-.01em}
  .stat .v small{display:block; color:var(--muted); font-size:.72rem; font-weight:400; margin-top:2px}

  .fact{margin-top:20px; position:relative; padding:16px 16px 16px 20px;
    background:linear-gradient(120deg, rgba(121,224,255,.08), rgba(255,210,122,.05));
    border:1px solid var(--line); border-radius:14px}
  .fact::before{content:""; position:absolute; left:0; top:14px; bottom:14px; width:3px; border-radius:3px;
    background:linear-gradient(var(--accent),var(--accent-2))}
  .fact .fk{font-family:var(--mono); font-size:.58rem; letter-spacing:.24em; text-transform:uppercase; color:var(--accent); margin-bottom:8px}
  .fact p{margin:0; font-size:.96rem; line-height:1.5; color:var(--ink)}

  /* ---------- mobile ---------- */
  @media (max-width:720px){
    .head-right{display:none}
    .controls{gap:12px 16px}
    input[type=range]{width:120px}
    .panel{
      top:auto; bottom:0; right:0; width:100%; height:auto; max-height:82vh;
      border-left:none; border-top:1px solid var(--line-2);
      border-radius:20px 20px 0 0;
      transform:translateY(105%);
    }
    .panel.open{transform:translateY(0)}
  }
  @media (prefers-reduced-motion:reduce){
    .star,.sun-core,.sun-halo,.live{animation:none}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="head-left">
      <p class="kicker">Orbital Diagram · 1 : 1,000,000,000,000</p>
      <h1>Interactive Solar System</h1>
      <p class="sub">Click any planet to learn more. <b>Drag</b> to pan · <b>scroll</b> to zoom.</p>
    </div>
    <div class="head-right">
      <span class="readout"><span class="live"></span> SIMULATION · LIVE</span>
    </div>
  </header>

  <div class="controls">
    <div class="ctrl">
      <span class="ctrl-label">Orbit speed</span>
      <input id="speed" type="range" min="0" max="10" step="0.5" value="2" aria-label="Orbital animation speed">
      <span class="ctrl-val" id="speedVal">2.0×</span>
    </div>
    <button class="toggle" id="labels" aria-pressed="true">
      <span class="track"><span class="knob"></span></span> Labels
    </button>
    <button class="toggle" id="orbits" aria-pressed="true">
      <span class="track"><span class="knob"></span></span> Orbits
    </button>
    <button class="toggle" id="reset" aria-pressed="false">
      <span class="track"><span class="knob"></span></span> Reset view
    </button>
  </div>

  <div class="stage" id="stage">
    <svg class="stars" id="stars" preserveAspectRatio="xMidYMid slice"></svg>
    <svg id="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" aria-label="Solar system diagram"></svg>
    <div class="tip" id="tip"></div>

    <aside class="panel" id="panel" aria-hidden="true" aria-label="Planet details">
      <div class="panel-top">
        <span class="tag" id="pTag">Body</span>
        <button class="close" id="close" aria-label="Close panel">✕</button>
      </div>
      <div class="panel-body" id="panelBody"></div>
    </aside>
  </div>
</div>

<script>
(function(){
  "use strict";

  // ---------- data (exact values) ----------
  var DATA = [
    {id:"sun", name:"Sun", type:"star", color:"#ffcf6b", r:46,
     diameter:"1,392,700 km", au:"0 AU", km:"—", orbital:"N/A", rotation:"~25 days", moons:"0",
     fact:"Contains 99.86% of the mass in the solar system."},
    {id:"mercury", name:"Mercury", type:"planet", color:"#9c9a97", r:7,  orbit:80,  speed:4.15,
     diameter:"4,879 km", au:"0.39 AU", km:"57.9M km", orbital:"88 days", rotation:"59 days", moons:"0",
     fact:"A year on Mercury is shorter than a day."},
    {id:"venus", name:"Venus", type:"planet", color:"#e6c079", r:11, orbit:118, speed:1.62,
     diameter:"12,104 km", au:"0.72 AU", km:"108.2M km", orbital:"225 days", rotation:"243 days (retrograde)", moons:"0",
     fact:"Spins backwards compared to most planets."},
    {id:"earth", name:"Earth", type:"planet", color:"#4f8fd6", r:12, orbit:162, speed:1.0,
     diameter:"12,742 km", au:"1.00 AU", km:"149.6M km", orbital:"365.25 days", rotation:"24 hours", moons:"1",
     fact:"The only known planet with liquid water on its surface."},
    {id:"mars", name:"Mars", type:"planet", color:"#d1603a", r:9,  orbit:210, speed:0.53,
     diameter:"6,779 km", au:"1.52 AU", km:"227.9M km", orbital:"687 days", rotation:"24.6 hours", moons:"2",
     fact:"Home to Olympus Mons, the tallest volcano in the solar system."},
    {id:"jupiter", name:"Jupiter", type:"planet", color:"#d8b184", r:30, orbit:300, speed:0.084,
     diameter:"139,820 km", au:"5.20 AU", km:"778.5M km", orbital:"4,333 days", rotation:"9.9 hours", moons:"95",
     fact:"The Great Red Spot is a storm larger than Earth."},
    {id:"saturn", name:"Saturn", type:"planet", color:"#e9d29a", r:26, orbit:398, speed:0.034, ring:true,
     diameter:"116,460 km", au:"9.58 AU", km:"1.43B km", orbital:"10,759 days", rotation:"10.7 hours", moons:"146",
     fact:"Its rings are made of billions of ice and rock particles."},
    {id:"uranus", name:"Uranus", type:"planet", color:"#9fd9d6", r:18, orbit:490, speed:0.0119,
     diameter:"50,724 km", au:"19.22 AU", km:"2.87B km", orbital:"30,687 days", rotation:"17.2 hours (retrograde)", moons:"28",
     fact:"Tilted almost 98 degrees — it essentially rolls on its side."},
    {id:"neptune", name:"Neptune", type:"planet", color:"#3f6fd0", r:17, orbit:578, speed:0.0060,
     diameter:"49,244 km", au:"30.05 AU", km:"4.50B km", orbital:"60,190 days", rotation:"16.1 hours", moons:"16",
     fact:"Winds reach 2,100 km/h — the fastest in the solar system."}
  ];
  var byId = {}; DATA.forEach(function(b){ byId[b.id]=b; });

  var VBW=1600, VBH=900, CX=VBW/2, CY=VBH/2;
  var NS="http://www.w3.org/2000/svg";
  var scene=document.getElementById("scene");
  var stage=document.getElementById("stage");
  var starsSvg=document.getElementById("stars");
  var tip=document.getElementById("tip");
  var panel=document.getElementById("panel");
  var panelBody=document.getElementById("panelBody");
  var pTag=document.getElementById("pTag");

  var showLabels=true, showOrbits=true;
  var speed=2;
  var view={x:0,y:0,k:1};
  var activeId=null;

  function el(tag,attrs){
    var e=document.createElementNS(NS,tag);
    if(attrs) for(var k in attrs) e.setAttribute(k,attrs[k]);
    return e;
  }
  function shade(hex,amt){
    var n=parseInt(hex.slice(1),16), r=(n>>16)&255, g=(n>>8)&255, b=n&255;
    r=Math.max(0,Math.min(255,r+amt)); g=Math.max(0,Math.min(255,g+amt)); b=Math.max(0,Math.min(255,b+amt));
    return "rgb("+r+","+g+","+b+")";
  }

  // ---------- star field ----------
  (function buildStars(){
    var frag=document.createDocumentFragment();
    var i,cx,cy,r,c,dur;
    var palette=["#ffffff","#cfe0ff","#ffe9c8","#bcd4ff","#ffffff"];
    for(i=0;i<150;i++){
      cx=Math.random()*100; cy=Math.random()*100;
      r=0.4+Math.random()*1.5;
      c=palette[(Math.random()*palette.length)|0];
      var s=el("circle",{cx:cx,cy:cy,r:r,fill:c,"class":"star"});
      dur=(2.4+Math.random()*4).toFixed(2)+"s";
      s.style.setProperty("--d",dur);
      s.style.animationDelay=(-(Math.random()*5)).toFixed(2)+"s";
      frag.appendChild(s);
    }
    // a few brighter sparkles
    for(i=0;i<6;i++){
      cx=5+Math.random()*90; cy=5+Math.random()*90;
      var sp=el("path",{d:"M "+cx+" "+(cy-4)+" L "+(cx+1.1)+" "+(cy-1.1)+" L "+(cx+4)+" "+cy+
        " L "+(cx+1.1)+" "+(cy+1.1)+" L "+cx+" "+(cy+4)+" L "+(cx-1.1)+" "+(cy+1.1)+
        " L "+(cx-4)+" "+cy+" L "+(cx-1.1)+" "+(cy-1.1)+" Z", fill:"#ffffff","class":"star"});
      sp.style.setProperty("--d",(3+Math.random()*3).toFixed(2)+"s");
      sp.style.animationDelay=(-(Math.random()*4)).toFixed(2)+"s";
      frag.appendChild(sp);
    }
    starsSvg.setAttribute("viewBox","0 0 100 100");
    starsSvg.appendChild(frag);
  })();

  // ---------- scene defs ----------
  var defs=el("defs");
  function radial(id,stops){
    var g=el("radialGradient",{id:id,cx:"35%",cy:"30%",r:"78%"});
    stops.forEach(function(s){ g.appendChild(el("stop",{offset:s[0],"stop-color":s[1]})); });
    return g;
  }
  defs.appendChild(radial("g-sun",[["0%","#fff7dd"],["45%","#ffd27a"],["100%","#ff8a2a"]]));
  defs.appendChild(radial("g-sunhalo",[["0%","rgba(255,190,90,.55)"],["100%","rgba(255,150,40,0)"]]));
  DATA.forEach(function(b){
    if(b.type==="star") return;
    defs.appendChild(radial("g-"+b.id,[
      ["0%", shade(b.color,70)],
      ["55%", b.color],
      ["100%", shade(b.color,-70)]
    ]));
  });
  scene.appendChild(defs);

  // ---------- orbits ----------
  var orbitLayer=el("g");
  scene.appendChild(orbitLayer);
  var orbitEls={};
  DATA.forEach(function(b){
    if(!b.orbit) return;
    var o=el("circle",{cx:CX,cy:CY,r:b.orbit,"class":"orbit"});
    orbitLayer.appendChild(o);
    orbitEls[b.id]=o;
  });

  // ---------- sun ----------
  var sunG=el("g",{"class":"sun","data-id":"sun"});
  sunG.appendChild(el("circle",{cx:CX,cy:CY,r:120,fill:"url(#g-sunhalo)","class":"sun-halo"}));
  sunG.appendChild(el("circle",{cx:CX,cy:CY,r:46,fill:"url(#g-sun)","class":"sun-core"}));
  scene.appendChild(sunG);
  var sunLabel=el("text",{x:CX,y:CY-62,"class":"label show","text-anchor":"middle"});
  sunLabel.textContent="SUN";
  scene.appendChild(sunLabel);

  // ---------- planets ----------
  var planetGroups=[];
  var labelEls={};
  DATA.forEach(function(b){
    if(b.type==="star") return;
    var g=el("g",{"class":"planet","data-id":b.id});
    if(b.ring){
      g.appendChild(el("ellipse",{cx:0,cy:0,rx:b.r*2.1,ry:b.r*0.72,fill:"none",
        stroke:"rgba(255,255,255,.35)","stroke-width":b.r*0.5,"class":"ring-halo"}));
      g.appendChild(el("ellipse",{cx:0,cy:0,rx:b.r*2.1,ry:b.r*0.72,fill:"none",
        stroke:shade(b.color,25),"stroke-width":b.r*0.5,"class":"ring",
        transform:"rotate(-18)"}));
    }
    g.appendChild(el("circle",{cx:0,cy:0,r:b.r*2.1,fill:b.color,"class":"halo",opacity:0}));
    g.appendChild(el("circle",{cx:0,cy:0,r:b.r,fill:"url(#g-"+b.id+")","class":"disc"}));
    scene.appendChild(g);

    var t=el("text",{"class":"label","text-anchor":"middle"});
    t.textContent=b.name.toUpperCase();
    scene.appendChild(t);
    labelEls[b.id]=t;
    planetGroups.push({b:b,g:g});
  });

  // ---------- interaction: hover ----------
  function setTip(id,clientX,clientY){
    tip.textContent=byId[id].name;
    var rect=stage.getBoundingClientRect();
    tip.style.left=(clientX-rect.left)+"px";
    tip.style.top=(clientY-rect.top)+"px";
    tip.classList.add("show");
  }
  function hideTip(){ tip.classList.remove("show"); }

  scene.addEventListener("pointermove",function(e){
    var t=e.target.closest && e.target.closest("[data-id]");
    if(t) setTip(t.getAttribute("data-id"),e.clientX,e.clientY);
    else hideTip();
  });
  scene.addEventListener("pointerleave",hideTip);

  // ---------- selection ----------
  function setActive(id){
    activeId=id;
    planetGroups.forEach(function(p){
      var on=(p.b.id===id);
      p.g.classList.toggle("active",on);
      if(orbitEls[p.b.id]) orbitEls[p.b.id].classList.toggle("active",on);
      var l=labelEls[p.b.id]; if(l) l.classList.toggle("active",on);
    });
    sunG.classList.toggle("active", id==="sun");
    sunLabel.classList.toggle("active", id==="sun");
  }

  function openPanel(b){
    pTag.textContent = b.type==="star" ? "G-type star" : "Planet";
    var swatchStyle="background:radial-gradient(circle at 34% 30%, rgba(255,255,255,.55), transparent 45%), "+b.color+
      "; box-shadow:0 0 26px -4px "+b.color+";";
    var ringed = b.ring ? " ringed":"";
    var html =
      '<div class="p-head">'+
        '<div class="p-swatch'+ringed+'" style="'+swatchStyle+'"></div>'+
        '<div><h2 class="p-name">'+b.name+'</h2>'+
        '<p class="p-class">'+(b.type==="star"?"The heart of the system":"Planet · "+b.au)+'</p></div>'+
      '</div>'+
      '<div class="stats">'+
        stat("Diameter",b.diameter)+
        stat("Distance",b.au, b.km==="—" ? null : b.km)+
        stat("Orbital period",b.orbital)+
        stat("Rotation",b.rotation)+
        stat("Moons",b.moons)+
      '</div>'+
      '<div class="fact"><div class="fk">Did you know?</div><p>'+b.fact+'</p></div>';
    panelBody.innerHTML=html;
    panel.classList.add("open");
    panel.setAttribute("aria-hidden","false");
    panelBody.scrollTop=0;
  }
  function stat(k,v,sub){
    return '<div class="stat"><div class="k">'+k+'</div><div class="v">'+v+
      (sub? '<small>'+sub+'</small>':'')+'</div></div>';
  }
  function closePanel(){
    panel.classList.remove("open");
    panel.setAttribute("aria-hidden","true");
    setActive(null);
  }

  scene.addEventListener("click",function(e){
    var t=e.target.closest && e.target.closest("[data-id]");
    if(!t) return;
    var id=t.getAttribute("data-id");
    setActive(id);
    openPanel(byId[id]);
  });
  document.getElementById("close").addEventListener("click",closePanel);
  document.addEventListener("keydown",function(e){ if(e.key==="Escape") closePanel(); });

  // ---------- controls ----------
  var speedInput=document.getElementById("speed");
  var speedVal=document.getElementById("speedVal");
  function syncSpeed(){
    speed=parseFloat(speedInput.value);
    speedVal.textContent=speed.toFixed(1)+"×";
    speedInput.style.setProperty("--fill",(speed/10*100)+"%");
  }
  speedInput.addEventListener("input",syncSpeed);
  syncSpeed();

  function bindToggle(id,fn){
    var btn=document.getElementById(id);
    btn.addEventListener("click",function(){
      var on=btn.getAttribute("aria-pressed")!=="true";
      btn.setAttribute("aria-pressed",on?"true":"false");
      fn(on);
    });
  }
  bindToggle("labels",function(on){
    showLabels=on;
    Object.keys(labelEls).forEach(function(k){ labelEls[k].classList.toggle("show",on); });
    sunLabel.classList.toggle("show",on);
  });
  bindToggle("orbits",function(on){
    showOrbits=on;
    orbitLayer.style.display=on?"":"none";
  });
  bindToggle("reset",function(){
    animateViewTo({x:0,y:0,k:1},600);
    setTimeout(function(){ document.getElementById("reset").setAttribute("aria-pressed","false"); },600);
  });

  // ---------- pan & zoom ----------
  function applyView(){ scene.setAttribute("transform","translate("+view.x+" "+view.y+") scale("+view.k+")"); }
  function animateViewTo(target,dur){
    var from={x:view.x,y:view.y,k:view.k}, t0=performance.now();
    function step(now){
      var p=Math.min(1,(now-t0)/dur);
      var e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
      view.x=from.x+(target.x-from.x)*e;
      view.y=from.y+(target.y-from.y)*e;
      view.k=from.k+(target.k-from.k)*e;
      applyView();
      if(p<1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  var dragging=false, moved=false, lastX=0, lastY=0;
  stage.addEventListener("pointerdown",function(e){
    if(e.target.closest(".panel")) return;
    dragging=true; moved=false; lastX=e.clientX; lastY=e.clientY;
    stage.classList.add("dragging");
    stage.setPointerCapture && stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener("pointermove",function(e){
    if(!dragging) return;
    var dx=e.clientX-lastX, dy=e.clientY-lastY;
    if(Math.abs(dx)+Math.abs(dy)>3) moved=true;
    var scale=stage.clientWidth/VBW;
    view.x+=dx/scale; view.y+=dy/scale;
    lastX=e.clientX; lastY=e.clientY;
    applyView();
  });
  function endDrag(){ dragging=false; stage.classList.remove("dragging"); }
  stage.addEventListener("pointerup",endDrag);
  stage.addEventListener("pointercancel",endDrag);

  // suppress click after a drag
  stage.addEventListener("click",function(e){
    if(moved){ e.stopPropagation(); e.preventDefault(); moved=false; }
  },true);

  stage.addEventListener("wheel",function(e){
    e.preventDefault();
    var rect=stage.getBoundingClientRect();
    var px=(e.clientX-rect.left)/rect.width*VBW;
    var py=(e.clientY-rect.top)/rect.height*VBH;
    var factor=e.deltaY<0?1.12:1/1.12;
    var nk=Math.max(0.6,Math.min(4,view.k*factor));
    var scale=nk/view.k;
    view.x=px-(px-view.x)*scale;
    view.y=py-(py-view.y)*scale;
    view.k=nk;
    applyView();
  },{passive:false});

  // ---------- animation ----------
  var last=performance.now();
  function tick(now){
    var dt=(now-last)/1000; last=now;
    if(dt>0.1) dt=0.1;
    var base=0.35;
    planetGroups.forEach(function(p){
      var a=p.b.angle + base*speed*dt*p.b.speed;
      p.b.angle=a;
      var x=CX+Math.cos(a)*p.b.orbit;
      var y=CY+Math.sin(a)*p.b.orbit;
      p.g.setAttribute("transform","translate("+x+" "+y+")");
      var l=labelEls[p.b.id];
      l.setAttribute("x",x);
      l.setAttribute("y",y+p.b.r+18);
    });
    requestAnimationFrame(tick);
  }

  // random starting angles
  planetGroups.forEach(function(p){ p.b.angle=Math.random()*Math.PI*2; });

  applyView();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
